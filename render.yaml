# Creates only a free web service. Database credentials are supplied securely in Render.
services:
  - type: web
    name: pixel-playground
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/bootstrap
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: REQUIRE_REMOTE_DATABASE
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
